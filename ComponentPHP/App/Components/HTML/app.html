!@(component|app)
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>!@($title)</title>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="CSS/main.css">
        <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
        <style>
            #app-player-target {
                width: 100%;
                position: absolute;
                bottom: 0;
                left: 0;
            }

            audio {
                width: 100%;
            }
        </style>
        !@($head)
        !@($css)
    </head>
    <body>
        !@($navigation)
        <main>
            !@($body)
            <div id="app-body-target">!@($htmxBodyPreload)</div>
            <div id="app-player-target"></div>
        </main>
    </body>
    !@($script)
</html>
!@(end)
