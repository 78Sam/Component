!@(component|songs)
<div class="d-flex">
    !@($songs)
</div>
!@(end)

!@(component|song)
<div class="song-wrapper">
    <div class="song" hx-get="/songs/!@($id)/play" hx-trigger="click" hx-target="#app-player-target" hx-swap="innerHTML">
        <p>!@($title)</p>
        <p>!@($artist)</p>
        <p>!@($duration)</p>
    </div>
    <div class="credits space-between">
        !@($name)
        <a class="danger" href="/songs/!@($id)/delete">!@($delete)</a>
    </div>
</div>
!@(end)

!@(component|player)
<p>!@($title) - !@($artist)</p>
<audio src="!@($source)" controls autoplay></audio>
!@(end)
