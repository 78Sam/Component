!@(component|songs)
<div class="d-flex">
    !@($songs)
</div>
!@(end)

!@(component|song)
<div class="container" hx-get="/songs/!@($id)/play" hx-trigger="click" hx-target="#app-player-target" hx-swap="innerHTML">
    <p>!@($id)</p>
    <p>!@($title)</p>
    <p>!@($artist)</p>
</div>
!@(end)

!@(component|player)
<div>
    <audio src="!@($source)" controls></audio>
</div>
!@(end)
